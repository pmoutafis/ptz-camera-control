<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi PTZ Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            padding: 16px;
            gap: 16px;
            overflow: hidden;
        }

        /* Left Column: Video Feed (2/3 width) */
        .video-container {
            flex: 2;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .video-header {
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            font-size: 0.95rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Right Column: Controls & Configuration (1/3 width) */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 420px;
            min-width: 320px;
        }

        .panel {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* Status & Tracker Box */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            width: fit-content;
        }

        .status-connected {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-disconnected {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .tracker-log {
            font-family: monospace;
            font-size: 0.8rem;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            color: #38bdf8;
            min-height: 42px;
            display: flex;
            align-items: center;
        }

        .duration-picker {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.85rem;
        }

        .duration-btn {
            flex: 1;
            padding: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .duration-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }

        /* D-Pad Controls Grid */
        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 220px;
            margin: 0 auto;
        }

        .btn {
            background: #334155;
            border: none;
            color: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, transform 0.05s ease;
            user-select: none;
        }

        .btn:hover { background: #475569; }
        .btn:active { transform: scale(0.96); background: #0284c7; }

        .btn-stop {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-size: 0.8rem;
        }

        .btn-stop:hover { background: rgba(239, 68, 68, 0.4); }

        /* Zoom Row */
        .zoom-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .zoom-btn {
            flex: 1;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-weight: 600;
            cursor: pointer;
        }

        .zoom-btn:hover { background: #334155; }
    </style>
</head>
<body>

    <!-- Left Column: Live Video Feed -->
    <div class="video-container">
        <div class="video-header">
            <span>Logitech PTZ Pro 2 — Live Feed</span>
            <span id="feed-status" style="color: #4ade80;">● Active</span>
        </div>
        <img id="camera-stream" class="video-frame" src="http://127.0.0.1:5001/video_feed" alt="Camera Stream Loading...">
    </div>

    <!-- Right Column: Top Tracker + Bottom PTZ Controls -->
    <div class="sidebar">
        
        <!-- Configuration Tracker (Top Right) -->
        <div class="panel">
            <div class="panel-title">System Status & Configuration</div>
            
            <div id="status-badge" class="status-badge status-disconnected">
                <span class="status-dot"></span>
                <span id="status-text">Connecting to Bridge...</span>
            </div>

            <div class="panel-title" style="margin-top: 8px;">Pulse Step Duration</div>
            <div class="duration-picker">
                <button class="duration-btn" onclick="setDuration(0.1, this)">0.1s (Fine)</button>
                <button class="duration-btn active" onclick="setDuration(0.2, this)">0.2s (Norm)</button>
                <button class="duration-btn" onclick="setDuration(0.4, this)">0.4s (Coarse)</button>
            </div>

            <div class="panel-title" style="margin-top: 8px;">Activity Tracker</div>
            <div id="activity-log" class="tracker-log">System initialized. Ready.</div>
        </div>

        <!-- PTZ Controls (Bottom Right) -->
        <div class="panel" style="flex: 1; justify-content: center;">
            <div class="panel-title" style="text-align: center; margin-bottom: 12px;">Pan / Tilt Controls</div>
            
            <div class="dpad-grid">
                <div></div>
                <button class="btn" onclick="sendPtz(0, 1)">▲</button>
                <div></div>

                <button class="btn" onclick="sendPtz(-1, 0)">◀</button>
                <button class="btn btn-stop" onclick="stopPtz()">STOP</button>
                <button class="btn" onclick="sendPtz(1, 0)">▶</button>

                <div></div>
                <button class="btn" onclick="sendPtz(0, -1)">▼</button>
                <div></div>
            </div>

            <div class="panel-title" style="text-align: center; margin-top: 16px;">Zoom Controls</div>
            <div class="zoom-row">
                <button class="zoom-btn" onclick="sendPtz(0, 0, 1)">🔍 Zoom In (+)</button>
                <button class="zoom-btn" onclick="sendPtz(0, 0, -1)">🔍 Zoom Out (-)</button>
            </div>
        </div>

    </div>

    <script>
        const BRIDGE_URL = "http://127.0.0.1:5001";
        let pulseDuration = 0.2;

        function setDuration(val, element) {
            pulseDuration = val;
            document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            logActivity(`Step duration set to ${val}s`);
        }

        function logActivity(message) {
            document.getElementById('activity-log').innerText = message;
        }

        async function checkHealth() {
            const badge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');

            try {
                const res = await fetch(`${BRIDGE_URL}/health`);
                if (res.ok) {
                    badge.className = "status-badge status-connected";
                    statusText.innerText = "Bridge Connected (Linux)";
                } else {
                    throw new Error("Bridge offline");
                }
            } catch (err) {
                badge.className = "status-badge status-disconnected";
                statusText.innerText = "Bridge Disconnected";
            }
        }

        async function sendPtz(pan = 0, tilt = 0, zoom = 0) {
            logActivity(`Sending command: Pan=${pan}, Tilt=${tilt}, Zoom=${zoom}`);
            try {
                await fetch(`${BRIDGE_URL}/ptz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pan, tilt, zoom, duration: pulseDuration })
                });
            } catch (err) {
                logActivity(`Error sending PTZ command`);
            }
        }

        async function stopPtz() {
            logActivity(`Emergency Stop Triggered`);
            try {
                await fetch(`${BRIDGE_URL}/ptz/stop`, { method: 'POST' });
            } catch (err) {
                logActivity(`Error sending stop command`);
            }
        }

        // Periodically poll bridge status every 3 seconds
        setInterval(checkHealth, 3000);
        checkHealth();
    </script>
</body>
</html>
