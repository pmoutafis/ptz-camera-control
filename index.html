<!DOCTYPE html>
<html>
<head>
    <title>Logitech PTZ Hardware Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #181818; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .viewport { width: 90vw; max-width: 640px; height: 360px; margin: 0 auto; border-radius: 8px; border: 2px solid #444; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 10px; font-size: 14px; border-radius: 6px; cursor: pointer; }
        button:active { background: #007acc; }
        .btn-danger { background: #dc3545; border-color: #dc3545; }
        .btn-success { background: #28a745; border-color: #28a745; }
        .row { display: flex; gap: 10px; align-items: center; justify-content: center; }
        input[type=text] { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; }
        .preset-card { background: #222; padding: 10px; border-radius: 6px; margin-top: 8px; text-align: left; width: 300px; display: flex; justify-content: space-between; align-items: center; }
        #status-log { background: #111; color: #00ff00; font-family: monospace; text-align: left; padding: 10px; margin: 15px auto; max-width: 640px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Logitech Hardware Camera Controller</h2>
    
    <div class="viewport">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    
    <div class="controls">
        <div class="grid">
            <div></div><button onclick="moveMotor('tilt', 1)">▲</button><div></div>
            <button onclick="moveMotor('pan', -1)">◀</button>
            <button onclick="resetMotors()">⟲</button>
            <button onclick="moveMotor('pan', 1)">▶</button>
            <div></div><button onclick="moveMotor('tilt', -1)">▼</button><div></div>
        </div>

        <div class="row">
            <button onclick="moveMotor('zoom', -1)">Zoom Out (-)</button>
            <button onclick="moveMotor('zoom', 1)">Zoom In (+)</button>
        </div>

        <div class="row" style="margin-top: 15px;">
            <input type="text" id="label" placeholder="Position Name">
            <button class="btn-success" onclick="saveLocation()">Save Location</button>
        </div>

        <div class="row">
            <button class="btn-danger" onclick="clearAllLocations()">Clear All Locations</button>
        </div>

        <div id="presets"></div>
    </div>

    <h3>Hardware Diagnostics</h3>
    <div id="status-log">Initializing...</div>

    <script>
        const video = document.getElementById('webcam');
        const statusLog = document.getElementById('status-log');
        let videoTrack = null;
        let capabilities = {};
        let currentSettings = { pan: 0, tilt: 0, zoom: 1 };

        function log(msg) {
            statusLog.textContent += "\n" + msg;
        }

        statusLog.textContent = `Secure Context (HTTPS or localhost): ${window.isSecureContext}`;

        // Request browser camera stream with physical hardware PTZ permissions
        navigator.mediaDevices.getUserMedia({
            video: {
                pan: true,
                tilt: true,
                zoom: true
            }
        }).then(stream => {
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            log(`Camera: ${videoTrack.label}`);

            if (videoTrack.getCapabilities) {
                capabilities = videoTrack.getCapabilities();
                log(`Capabilities Detected:\n${JSON.stringify(capabilities, null, 2)}`);
            } else {
                log("Error: getCapabilities() not supported by browser.");
            }

            const settings = videoTrack.getSettings();
            currentSettings.pan = settings.pan || 0;
            currentSettings.tilt = settings.tilt || 0;
            currentSettings.zoom = settings.zoom || 1;

            loadPresets();
        }).catch(err => {
            log(`Camera Access Error: ${err.name} - ${err.message}`);
        });

        async function applyMotorSetting() {
            if (!videoTrack) return;
            const constraints = { advanced: [{}] };
            
            if (capabilities.pan) constraints.advanced[0].pan = currentSettings.pan;
            if (capabilities.tilt) constraints.advanced[0].tilt = currentSettings.tilt;
            if (capabilities.zoom) constraints.advanced[0].zoom = currentSettings.zoom;

            try {
                await videoTrack.applyConstraints(constraints);
                log(`Applied PTZ Command: ${JSON.stringify(constraints.advanced[0])}`);
            } catch (err) {
                log(`Driver Execution Error: ${err.name} - ${err.message}`);
            }
        }

        function moveMotor(axis, direction) {
            if (!capabilities[axis]) {
                log(`Axis '${axis}' is not supported by driver.`);
                return;
            }
            
            const cap = capabilities[axis];
            const step = cap.step || (axis === 'zoom' ? 0.5 : 3600);
            
            let newValue = currentSettings[axis] + (direction * step);
            currentSettings[axis] = Math.max(cap.min, Math.min(cap.max, newValue));
            
            applyMotorSetting();
        }

        function resetMotors() {
            if (capabilities.pan) currentSettings.pan = 0;
            if (capabilities.tilt) currentSettings.tilt = 0;
            if (capabilities.zoom) currentSettings.zoom = capabilities.zoom.min || 1;
            applyMotorSetting();
        }

        function saveLocation() {
            const name = document.getElementById('label').value || "Preset Location";
            const presets = JSON.parse(localStorage.getItem('ptz_presets') || '{}');
            presets[name] = { ...currentSettings };
            localStorage.setItem('ptz_presets', JSON.stringify(presets));
            loadPresets();
        }

        function goToLocation(name) {
            const presets = JSON.parse(localStorage.getItem('ptz_presets') || '{}');
            if (presets[name]) {
                currentSettings = { ...presets[name] };
                applyMotorSetting();
            }
        }

        function deleteLocation(name) {
            const presets = JSON.parse(localStorage.getItem('ptz_presets') || '{}');
            delete presets[name];
            localStorage.setItem('ptz_presets', JSON.stringify(presets));
            loadPresets();
        }

        function clearAllLocations() {
            if (confirm("Delete all saved locations?")) {
                localStorage.removeItem('ptz_presets');
                loadPresets();
            }
        }

        function loadPresets() {
            const presets = JSON.parse(localStorage.getItem('ptz_presets') || '{}');
            let html = '<h3>Saved Locations</h3>';
            for (let key in presets) {
                html += `<div class="preset-card">
                    <div>
                        <strong>${key}</strong><br>
                        <button style="padding:4px 8px; margin-top:5px;" onclick="goToLocation('${key}')">Go To</button>
                    </div>
                    <button class="btn-danger" style="padding: 5px 8px;" onclick="deleteLocation('${key}')">✕</button>
                </div>`;
            }
            document.getElementById('presets').innerHTML = html;
        }
    </script>
</body>
</html>
