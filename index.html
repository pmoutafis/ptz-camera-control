<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi PTZ Console</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; padding: 12px; gap: 12px; overflow: hidden; }

        .video-container { flex: 2; background: #1e293b; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
        .video-header { padding: 10px 14px; background: #0f172a; border-bottom: 1px solid #334155; font-weight: 600; font-size: 0.85rem; color: #94a3b8; display: flex; justify-content: space-between; }
        .video-frame { flex: 1; width: 100%; height: 100%; object-fit: contain; background: #000; }

        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 10px; max-width: 400px; min-width: 310px; }
        .panel { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .panel-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; }

        .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; width: fit-content; }
        .status-connected { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-disconnected { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .offset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .offset-card { display: flex; flex-direction: column; align-items: center; }
        .offset-label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .offset-value { font-family: monospace; font-size: 1rem; color: #38bdf8; font-weight: bold; margin-top: 2px; }

        .duration-picker { display: flex; gap: 6px; }
        .duration-btn { flex: 1; padding: 6px; background: #0f172a; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .duration-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

        .tracker-log { font-family: monospace; font-size: 0.75rem; background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; color: #e2e8f0; min-height: 36px; display: flex; align-items: center; }

        .dpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 180px; margin: 0 auto; }
        .btn { background: #334155; border: none; color: #f8fafc; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn:hover { background: #475569; }
        .btn:active { background: #0284c7; }
        .btn:disabled { opacity: 0.25; cursor: not-allowed; background: #1e293b; }

        .btn-stop { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); font-size: 0.7rem; }
        .btn-reset { background: #0f172a; border: 1px solid #334155; color: #38bdf8; padding: 6px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }

        .zoom-row { display: flex; gap: 6px; }
        .zoom-btn { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-weight: 600; cursor: pointer; font-size: 0.8rem; user-select: none; }
        .zoom-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-header">
            <span>Logitech PTZ Pro 2 — Stream</span>
            <span style="color: #4ade80;">● Active</span>
        </div>
        <img id="camera-stream" class="video-frame" src="http://127.0.0.1:5001/video_feed" alt="Stream loading...">
    </div>

    <div class="sidebar">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="panel-title">System Status</div>
                <div id="status-badge" class="status-badge status-disconnected">
                    <span class="status-dot"></span>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>

            <div class="panel-title" style="margin-top: 4px;">Time & Absolute Offsets</div>
            <div class="offset-grid">
                <div class="offset-card">
                    <span class="offset-label">Pan</span>
                    <span id="offset-pan" class="offset-value">0.0s</span>
                </div>
                <div class="offset-card">
                    <span class="offset-label">Tilt</span>
                    <span id="offset-tilt" class="offset-value">0.0s</span>
                </div>
                <div class="offset-card">
                    <span class="offset-label">Zoom (Abs)</span>
                    <span id="offset-zoom" class="offset-value">100</span>
                </div>
            </div>
            <button class="btn-reset" onclick="resetOffsets()">Reset Center (0.0s, 100z)</button>

            <div class="panel-title" style="margin-top: 4px;">Step Duration</div>
            <div class="duration-picker">
                <button class="duration-btn active" onclick="setDuration(0.1, this)">0.1s</button>
                <button class="duration-btn" onclick="setDuration(0.2, this)">0.2s</button>
                <button class="duration-btn" onclick="setDuration(0.4, this)">0.4s</button>
            </div>

            <div class="panel-title" style="margin-top: 4px;">Activity Log</div>
            <div id="activity-log" class="tracker-log">V4L2 Native System ready.</div>
        </div>

        <div class="panel" style="flex: 1; justify-content: center;">
            <div class="panel-title" style="text-align: center;">Pan / Tilt Controls</div>
            
            <div class="dpad-grid">
                <div></div>
                <button id="btn-up" class="btn" onclick="sendPtz(0, 1, 0)">▲</button>
                <div></div>

                <button id="btn-left" class="btn" onclick="sendPtz(-1, 0, 0)">◀</button>
                <button class="btn btn-stop" onclick="stopPtz()">STOP</button>
                <button id="btn-right" class="btn" onclick="sendPtz(1, 0, 0)">▶</button>

                <div></div>
                <button id="btn-down" class="btn" onclick="sendPtz(0, -1, 0)">▼</button>
                <div></div>
            </div>

            <div class="panel-title" style="text-align: center; margin-top: 8px;">Zoom Controls</div>
            <div class="zoom-row">
                <button id="btn-zoomin" class="zoom-btn" onclick="sendPtz(0, 0, 1)">🔍 Zoom In (+)</button>
                <button id="btn-zoomout" class="zoom-btn" onclick="sendPtz(0, 0, -1)">🔍 Zoom Out (-)</button>
            </div>
        </div>
    </div>

    <script>
        const BRIDGE_URL = "http://127.0.0.1:5001";
        let pulseDuration = 0.1; 

        // Calibrated Asymmetric Physical Limits
        const LIMITS = { panMin: -6.8, panMax: 6.8, tiltMin: -2.4, tiltMax: 2.0, zoomMin: 100, zoomMax: 1000 };
        
        let currentPanSec = 0;
        let currentTiltSec = 0;
        let currentZoomAbs = 100;
        let isExecuting = false;

        function setDuration(val, element) {
            pulseDuration = val;
            document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            logActivity(`Step duration set to ${val}s`);
        }

        function logActivity(msg) { document.getElementById('activity-log').innerText = msg; }

        function setButtonsState(disabled) {
            ['btn-left', 'btn-right', 'btn-up', 'btn-down', 'btn-zoomin', 'btn-zoomout'].forEach(id => {
                document.getElementById(id).disabled = disabled;
            });
        }

        function updateDisplay() {
            document.getElementById('offset-pan').innerText = `${currentPanSec.toFixed(1)}s`;
            document.getElementById('offset-tilt').innerText = `${currentTiltSec.toFixed(1)}s`;
            document.getElementById('offset-zoom').innerText = `${currentZoomAbs}`;

            if (!isExecuting) {
                document.getElementById('btn-left').disabled = (currentPanSec <= LIMITS.panMin);
                document.getElementById('btn-right').disabled = (currentPanSec >= LIMITS.panMax);
                document.getElementById('btn-down').disabled = (currentTiltSec <= LIMITS.tiltMin);
                document.getElementById('btn-up').disabled = (currentTiltSec >= LIMITS.tiltMax);
                document.getElementById('btn-zoomout').disabled = (currentZoomAbs <= LIMITS.zoomMin);
                document.getElementById('btn-zoomin').disabled = (currentZoomAbs >= LIMITS.zoomMax);
            }
        }

        function resetOffsets() {
            if (isExecuting) return;
            currentPanSec = 0; currentTiltSec = 0; currentZoomAbs = 100;
            fetch(`${BRIDGE_URL}/ptz/stop`, { method: 'POST' });
            updateDisplay();
            logActivity("Offsets reset to Center (0.0s, 100z).");
        }

        async function checkHealth() {
            try {
                const res = await fetch(`${BRIDGE_URL}/health`);
                if (res.ok) {
                    document.getElementById('status-badge').className = "status-badge status-connected";
                    document.getElementById('status-text').innerText = "Connected";
                } else throw new Error();
            } catch {
                document.getElementById('status-badge').className = "status-badge status-disconnected";
                document.getElementById('status-text').innerText = "Disconnected";
            }
        }

        async function sendPtz(pan = 0, tilt = 0, zoom = 0) {
            if (isExecuting) return;

            const deltaPan = pan * pulseDuration;
            const deltaTilt = tilt * pulseDuration;
            const deltaZoom = zoom * 100;

            const targetPan = Math.max(LIMITS.panMin, Math.min(LIMITS.panMax, currentPanSec + deltaPan));
            const targetTilt = Math.max(LIMITS.tiltMin, Math.min(LIMITS.tiltMax, currentTiltSec + deltaTilt));
            const targetZoom = Math.max(LIMITS.zoomMin, Math.min(LIMITS.zoomMax, currentZoomAbs + deltaZoom));

            if (targetPan === currentPanSec && targetTilt === currentTiltSec && targetZoom === currentZoomAbs) {
                logActivity("Action blocked: Hardware limit reached.");
                return;
            }

            isExecuting = true;
            setButtonsState(true);

            currentPanSec = targetPan;
            currentTiltSec = targetTilt;
            currentZoomAbs = targetZoom;
            updateDisplay();

            logActivity(`Moving: Pan=${pan}, Tilt=${tilt}, Zoom=${zoom}`);
            
            fetch(`${BRIDGE_URL}/ptz`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan, tilt, zoom, duration: pulseDuration })
            }).catch(() => logActivity("Command failed"));

            // Unified lock duration for all controls (Pan, Tilt, Zoom)
            setTimeout(() => {
                isExecuting = false;
                setButtonsState(false);
                updateDisplay();
            }, (pulseDuration * 1000) + 50);
        }

        async function stopPtz() {
            logActivity(`Emergency Stop Triggered`);
            isExecuting = false;
            setButtonsState(false);
            try { await fetch(`${BRIDGE_URL}/ptz/stop`, { method: 'POST' }); } catch {}
            updateDisplay();
        }

        setInterval(checkHealth, 3000);
        checkHealth();
        updateDisplay();
    </script>
</body>
</html>
